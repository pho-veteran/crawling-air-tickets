name: Probe public VNA booking inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-vna-booking.yml, scripts/vna-booking-probe.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --dns-result-order=ipv4first scripts/vna-booking-probe.mjs
